# Builds the firmware on every push / pull request, with the library versions pinned in firmware/deps.env.
# Both .uf2 files (without / with Home Assistant) are attached to each run (Actions tab -> run -> Artifacts).
# Pushing a tag like v8 also publishes a GitHub Release with the .uf2 and the "## v8" notes from CHANGELOG.md:
#   git tag v8 && git push origin v8
name: Firmware

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: firmware/.deps
          key: deps-${{ hashFiles('firmware/deps.env') }}

      - name: Build
        run: bash firmware/build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: bc250_power-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            firmware/build/bc250_power.uf2
            firmware/build/bc250_power_ha.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = the "## <tag> — <date>" section of CHANGELOG.md
          awk -v t="$GITHUB_REF_NAME" '$0 ~ "^## "t"( |$)" {p=1; next} /^## |^---/ {p=0} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME — <date>' section. Add the release notes, then tag again."
            exit 1
          fi
          cp firmware/build/bc250_power.uf2 "bc250_power_${GITHUB_REF_NAME}.uf2"
          cp firmware/build/bc250_power_ha.uf2 "bc250_power_${GITHUB_REF_NAME}_ha.uf2"
          gh release create "$GITHUB_REF_NAME" "bc250_power_${GITHUB_REF_NAME}.uf2" "bc250_power_${GITHUB_REF_NAME}_ha.uf2" \
            --title "Firmware $GITHUB_REF_NAME" --notes-file notes.md
