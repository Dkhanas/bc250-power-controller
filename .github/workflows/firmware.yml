# Builds the firmware on every push / pull request, with the library versions pinned in firmware/deps.env.
# Both .uf2 files (without / with Home Assistant) are attached to each run (Actions tab -> run -> Artifacts).
# A GitHub Release with both .uf2 files and the "## v8" notes from CHANGELOG.md is published either
#   - from GitHub: Actions tab -> Firmware -> "Run workflow" -> type the version (v8) -> Run, or
#   - from the command line: git tag v8 && git push origin v8
# Running it again for an existing version replaces the files and notes of that Release.
name: Firmware

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. v8 (empty = only build)'
        required: false
        default: ''

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: firmware/.deps
          key: deps-${{ hashFiles('firmware/deps.env') }}

      - name: Build
        run: bash firmware/build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: bc250_power-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            firmware/build/bc250_power.uf2
            firmware/build/bc250_power_ha.uf2

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::Version must look like v8 (got '$TAG')."
            exit 1
          fi
          # Release notes = the "## <tag> — <date>" section of CHANGELOG.md
          awk -v t="$TAG" '$0 ~ "^## "t"( |$)" {p=1; next} /^## |^---/ {p=0} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $TAG — <date>' section. Add the release notes, then run again."
            exit 1
          fi
          cp firmware/build/bc250_power.uf2 "bc250_power_${TAG}.uf2"
          cp firmware/build/bc250_power_ha.uf2 "bc250_power_${TAG}_ha.uf2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release exists: replace its files and notes
            gh release upload "$TAG" "bc250_power_${TAG}.uf2" "bc250_power_${TAG}_ha.uf2" --clobber
            gh release edit "$TAG" --title "Firmware $TAG" --notes-file notes.md
          else
            # New release; creates the tag on this commit if it doesn't exist yet
            gh release create "$TAG" "bc250_power_${TAG}.uf2" "bc250_power_${TAG}_ha.uf2" \
              --target "$GITHUB_SHA" --title "Firmware $TAG" --notes-file notes.md
          fi
